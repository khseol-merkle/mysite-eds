version: 1
indices:
  site:
    include:
      - '**'
    exclude:
      - '**/drafts/**'
    target: /query-index
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
  repo:
    target: /repo-index
    properties:
      lastUpdated:
        select: head > meta[name="last-updated"]
        value: dateValue(attribute(el, "content"), "YYYY-MM-DD")
